name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - backend/**
  pull_request:
    paths:
      - backend/**

jobs:
  backend:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
