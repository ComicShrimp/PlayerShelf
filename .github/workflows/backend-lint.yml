name: Lint

on:
  push:
    branches:
      - main
    paths:
      - backend/**
  pull_request:
    paths:
      - backend/**

jobs:
  backend:
    name: Verify Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
